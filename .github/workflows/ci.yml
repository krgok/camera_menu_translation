# 最小のCI: lint・テスト・ビルドのみ。デプロイはしない(デプロイはVercelのGit連携が行う)。
# 秘密(APIキー等)は一切使わない。テストは外部APIをモックする。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
